<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <form action="index.html" method="get">
        <fieldset>
            <legend>Datos personales by Jaime</legend>
            
            <p>
                <!-- label: etiqueta para un campo; for: enlaza con el id -->
                <label for="nombre">Nombre:</label><br>
                <!-- input: campo de entrada; type: tipo de dato; placeholder: texto orientativo; required: obligatorio; autofocus: foco inicial; size: ancho visible; maxlength: caracteres máximos -->
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">
            </p>

            <p>
                <label for="pass">Contraseña:</label><br>
                <!-- minlength: longitud mínima permitida -->
                <input type="password" id="pass" name="password" minlength="8">
            </p>

            <p>
                <label for="email">Correo:</label><br>
                <!-- type="email": valida formato de correo electrónico -->
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="tel">Teléfono:</label><br>
                <!-- type="tel": campo telefónico; pattern: expresión regular de validación -->
                <input type="tel" id="tel" name="telefono" pattern="[0-9]{9}">
            </p>
            
            <p>
                <label for="nacimiento">Fecha de nacimiento:</label><br>
                <!-- type="date": selector de fecha -->
                <input type="date" id="nacimiento" name="fnac">
            </p>

            <p>
                <label for="foto">Foto:</label><br>
                <!-- type="file": selector de archivos -->
                <input type="file" id="foto" name="archivo">
            </p>

            <p>
                <label for="curso">Curso:</label><br>
                <!-- value: valor por defecto; readonly: campo de solo lectura -->
                <input type="text" id="curso" name="curso" value="2026-27" readonly>
            </p>

            <p>
                <label for="centro">Centro:</label><br>
                <!-- disabled: campo deshabilitado que no se envía -->
                <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
            </p>
        </fieldset>
        <fieldset>
            <legend>Preferencias</legend>
    
            <p>Turno:</p>
            <p>
                <!-- type="radio": opción excluyente -->
                <label><input type="radio" name="turno" value="mañana"> Mañana</label>
                <label><input type="radio" name="turno" value="tarde"> Tarde</label>
            </p>

            <p>Intereses:</p>
            <p>
                <!-- type="checkbox": opción múltiple; value: valor enviado si se marca -->
                <label><input type="checkbox" name="interes" value="deporte"> Deporte</label>
                <label><input type="checkbox" name="interes" value="lectura"> Lectura</label>
                <label><input type="checkbox" name="interes" value="musica"> Música</label>
            </p>
            
            <p>
                <label for="horas">Horas de estudio:</label><br>
                <!-- type="number": selector numérico; min, max, step: límites e incremento -->
                <input type="number" id="horas" name="horas" min="0" max="10" step="2">
            </p>

            <p>
                <label for="nivel">Nivel:</label><br>
                <!-- type="range": control deslizante -->
                <input type="range" id="nivel" name="nivel" min="1" max="10">
            </p>

            <p>
                <label for="color">Color favorito:</label><br>
                <!-- type="color": selector de colores -->
                <input type="color" id="color" name="color">
            </p>

            <p>
                <label for="hora">Hora:</label><br>
                <!-- type="time": selector de hora -->
                <input type="time" id="hora" name="hora">
            </p>

            <p>
                <label for="semana">Semana:</label><br>
                <!-- type="week": selector de semana -->
                <input type="week" id="semana" name="semana">
            </p>

            <p>
                <label for="mes">Mes:</label><br>
                <!-- type="month": selector de mes -->
                <input type="month" id="mes" name="mes">
            </p>

            <p>
                <label for="modulos">Módulos:</label><br>
                <!-- select: lista desplegable; multiple: permite selección múltiple -->
                <select id="modulos" name="modulos" multiple>
                    <!-- optgroup: agrupa opciones; label: nombre del grupo -->
                    <optgroup label="Primero">
                        <!-- option: opción individual; selected: seleccionada por defecto -->
                        <option value="lm" selected>Lenguaje de Marcas</option>
                        <option value="ed">Entornos de Desarrollo</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <label for="comentarios">Comentarios:</label><br>
                <!-- textarea: cuadro de texto grande; rows, cols: filas y columnas -->
                <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
            </p>
        </fieldset>
        <!-- input de tipo submit, reset y button -->
        <p>
            <!-- type="submit": envía los datos del formulario al servidor -->
            <input type="submit" value="Enviar (input)">
            <!-- type="reset": restablece todos los campos del formulario a sus valores iniciales -->
            <input type="reset" value="Restablecer (input)">
            <!-- type="button": botón genérico interactivo sin comportamiento por defecto -->
            <input type="button" value="Botón genérico (input)">
        </p>

        <!-- input de tipo image, con src y alt -->
        <p>
            <!-- type="image": funciona como un botón de envío gráfico; src: ruta de la imagen; alt: texto alternativo si la imagen no carga -->
            <input type="image" src="img/img_boton.png" alt="Enviar imagen">
        </p>

        <!-- button de tipo submit, reset y button -->
        <p>
            <!-- button type="submit": elemento de botón moderno que envía el formulario -->
            <button type="submit">Enviar (button)</button>
            <!-- button type="reset": elemento de botón moderno que limpia el formulario -->
            <button type="reset">Restablecer (button)</button>
            <!-- button type="button": elemento de botón moderno genérico -->
            <button type="button">Botón genérico (button)</button>
        </p>
    </form>
    <form action="https://es.wikipedia.org/w/index.php" method="get">
    <p>
        <label for="busqueda-wiki">Buscar en Wikipedia:</label><br>
        <!-- type="search": campo de búsqueda; list: conecta con un datalist -->
        <input type="search" id="busqueda-wiki" name="search" list="sugerencias">
        <!-- datalist: lista de opciones sugeridas -->
        <datalist id="sugerencias">
            <option value="Formulario web">
            <option value="HTML">
            <option value="Protocolo de transferencia de hipertexto">
        </datalist>
        <button type="submit">Buscar</button>
    </p>
</form>
</body>
</html>
